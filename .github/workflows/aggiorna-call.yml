name: Aggiorna le call scadute

# Ogni mattina alle 05:30 UTC (07:30 in Italia). Il generatore confronta la
# deadline di ogni card con la data del giorno: quelle scadute escono dalle
# open call ed entrano in archivio, gia ordinate per data.
#
# Pubblica SOLO se il sito ricostruito e diverso da quello nel repo, e dopo
# la pubblicazione salva il sito nel repo: cosi il giorno dopo non c e nulla
# di nuovo e non si ripubblica. Prima pubblicava ogni giorno appena una call
# era scaduta (ottobre 2026: 8 deploy di fila, ~15 crediti Netlify l uno).
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:        # per lanciarlo a mano quando serve
    inputs:
      pubblica_comunque:
        description: "Pubblica anche se nessuna call e scaduta (per provare il token)"
        type: boolean
        default: false

permissions:
  contents: write           # per salvare nel repo il sito pubblicato

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa Pillow
        run: pip install --quiet Pillow

      - name: Ricostruisci il sito
        id: build
        run: |
          python3 build.py
          if [ -n "$(git status --porcelain -- site)" ]; then
            echo "cambiato=si" >> "$GITHUB_OUTPUT"
          else
            echo "cambiato=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Pubblica su Netlify
        if: steps.build.outputs.cambiato == 'si' || inputs.pubblica_comunque
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx -y netlify-cli@latest deploy --dir=site --prod \
            --site=b62e6fd3-d064-4e4d-8447-79c9f01ccb96 \
            --message "archiviazione automatica delle call scadute"

      - name: Salva nel repo il sito pubblicato
        if: steps.build.outputs.cambiato == 'si'
        run: |
          git config user.name "elverdinho"
          git config user.email "lorenzoverde6@gmail.com"
          git add site
          git commit -m "Archiviazione automatica delle call scadute"
          git push

      - name: Niente da fare
        if: steps.build.outputs.cambiato == 'no' && !inputs.pubblica_comunque
        run: echo "Il sito non e cambiato: niente da pubblicare."
